name: Deploy to AWS

on:
  push:
    branches:
      - main        # Deploy to production
      - develop     # Deploy to development
      - staging     # Deploy to staging
  workflow_dispatch:  # Allow manual trigger
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: "18"
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================================
  # Determine Environment
  # ============================================================================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      aws-region: ${{ steps.set-env.outputs.aws-region }}

    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "aws-region=us-east-1" >> $GITHUB_OUTPUT
          echo "🚀 Deploying to: $ENV"

  # ============================================================================
  # Run Tests Before Deploy
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with test

      - name: Run tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          DYNAMODB_ENDPOINT_URL: http://localhost:8000
        run: poetry run pytest tests/ -v --cov=app --cov-report=term-missing

  # ============================================================================
  # Deploy to AWS Lambda
  # ============================================================================
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, test]
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.aws-region }}

      - name: Install Serverless Framework
        run: |
          npm install -g serverless@3
          npm install

      - name: Install Python dependencies
        run: |
          pip install poetry
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Deploy to AWS Lambda
        env:
          ENV: ${{ needs.setup.outputs.environment }}
          AWS_REGION: ${{ needs.setup.outputs.aws-region }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DYNAMODB_USERS_TABLE: kush-users-${{ needs.setup.outputs.environment }}
        run: |
          echo "🚀 Deploying to $ENV environment..."
          serverless deploy --stage $ENV --region $AWS_REGION --verbose

      - name: Get deployment info
        run: |
          serverless info --stage ${{ needs.setup.outputs.environment }}

      - name: Run smoke tests
        env:
          ENV: ${{ needs.setup.outputs.environment }}
        run: |
          echo "🔍 Running smoke tests..."
          ENDPOINT=$(serverless info --stage $ENV | grep "endpoint:" | awk '{print $2}')
          echo "Testing endpoint: $ENDPOINT/api/v1/health"

          # Wait for deployment to be ready
          sleep 10

          # Test health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" $ENDPOINT/api/v1/health || echo "000")

          if [ "$response" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed with status: $response"
            exit 1
          fi

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ needs.setup.outputs.aws-region }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          serverless info --stage ${{ needs.setup.outputs.environment }} >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Rollback on Failure
  # ============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: failure() && needs.setup.outputs.environment != 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.aws-region }}

      - name: Rollback deployment
        run: |
          echo "⚠️ Deployment failed, rolling back..."
          # Add rollback logic here if needed
          echo "Please check AWS Console for manual rollback if necessary"

  # ============================================================================
  # Notify on Completion
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: always()

    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ needs.deploy.result }}"
          COLOR="good"

          if [ "$STATUS" = "failure" ]; then
            COLOR="danger"
            EMOJI="❌"
          else
            COLOR="good"
            EMOJI="✅"
          fi

          curl -X POST ${{ vars.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "'$COLOR'",
                "title": "'$EMOJI' Deployment to ${{ needs.setup.outputs.environment }}",
                "text": "Status: '$STATUS'",
                "fields": [
                  {"title": "Environment", "value": "${{ needs.setup.outputs.environment }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }'