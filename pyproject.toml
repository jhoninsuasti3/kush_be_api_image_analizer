[tool.poetry]
name = "kush-be-api-image-analizer"
version = "0.1.0"
description = "Backend API serverless para análisis inteligente de imágenes con IA"
authors = ["jhonmo <jhonmo@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11, <3.14"
fastapi = {version = ">=0.115.0, <1.0.0", extras = ["standard"]}
uvicorn = {version = ">=0.27.0, <1.0.0", extras = ["standard"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# AWS
boto3 = "^1.35.0"
mangum = "^0.17.0"

# AI
google-cloud-vision = "^3.7.0"
pillow = "^10.2.0"

# Auth
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
python-multipart = "^0.0.18"

# Utils
python-dotenv = "^1.0.0"
structlog = "^24.0.0"

[tool.poetry.group.code-quality]
optional = true
[tool.poetry.group.code-quality.dependencies]
ruff = ">=0.6.0, <1.0.0"
mypy = "^1.11.0"
pre-commit = "^3.5.0"

[tool.poetry.group.test]
optional = true
[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
faker = "^33.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================================
# RUFF Configuration (Linting + Formatting)
# ============================================================================
[tool.ruff]
target-version = "py311"
line-length = 119
show-fixes = true
extend-exclude = ["local/", ".venv/", "venv/", "insights_backend/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# MYPY Configuration (Type Checking)
# ============================================================================
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_untyped_calls = false
show_column_numbers = true
ignore_missing_imports = true
exclude = [".venv/", "venv/", "local/", "tests/", "insights_backend/"]

# ============================================================================
# COVERAGE Configuration
# ============================================================================
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "local/*", ".venv/*", "insights_backend/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ============================================================================
# PYTEST Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"