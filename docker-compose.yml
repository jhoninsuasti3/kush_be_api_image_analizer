services:
  # ============================================================================
  # DynamoDB Local for development
  # ============================================================================
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: kush-dynamodb-local
    ports:
      - "8001:8000"  # Changed to 8001 to avoid conflict with API
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    networks:
      - kush-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # DynamoDB Table Initialization
  # ============================================================================
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: kush-dynamodb-init
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - kush-network
    depends_on:
      dynamodb-local:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Creating DynamoDB tables..."

        # Create Users table
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name kush-users-dev \
          --attribute-definitions \
            AttributeName=email,AttributeType=S \
          --key-schema \
            AttributeName=email,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-1 2>/dev/null || echo "Users table already exists"

        # Create Image Analysis table with GSI
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name kush-image-analysis-dev \
          --attribute-definitions \
            AttributeName=analysis_id,AttributeType=S \
            AttributeName=user_email,AttributeType=S \
            AttributeName=analyzed_at_timestamp,AttributeType=N \
          --key-schema \
            AttributeName=analysis_id,KeyType=HASH \
          --global-secondary-indexes \
            "[{\"IndexName\":\"user_email-index\",\"KeySchema\":[{\"AttributeName\":\"user_email\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"analyzed_at_timestamp\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]" \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-1 2>/dev/null || echo "Analysis table already exists"

        echo "All tables created successfully!"

  # ============================================================================
  # FastAPI Application (Development)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development  # Use development stage from multi-stage build
    container_name: kush-api
    ports:
      - "8000:8000"  # API accessible at http://localhost:8000
    env_file:
      - .env
    environment:
      # Override .env for Docker environment
      - ENVIRONMENT=development
      - DEBUG=true
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - DYNAMODB_USERS_TABLE=kush-users-dev
      - DYNAMODB_ANALYSIS_TABLE=kush-image-analysis-dev
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-vision-credentials.json
    volumes:
      # Mount app code for hot reload
      - ./app:/app/app
      # Mount pyproject.toml for dependency changes
      - ./pyproject.toml:/app/pyproject.toml
      - ./poetry.lock:/app/poetry.lock
      # Mount credentials folder (read-only)
      - ./credentials:/app/credentials:ro
    depends_on:
      dynamodb-local:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    networks:
      - kush-network
    restart: unless-stopped
    # Command is already set in Dockerfile, but can be overridden here if needed

networks:
  kush-network:
    driver: bridge
